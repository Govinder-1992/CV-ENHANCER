name: Deploy CV Enhancer (SAM)

# Build, package, and deploy the SAM stack (API Gateway + SQS + worker Lambda)
# on every push to main. AWS credentials come from repository secrets.

on:
  push:
    branches: [main]
    # Run on backend/infra changes. The frontend is run locally, not hosted.
    paths:
      - "src/**"
      - "template.yaml"
      - "samconfig.toml"
      - ".github/workflows/deploy.yml"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Avoid overlapping deploys stepping on each other.
concurrency:
  group: sam-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  SAM_TEMPLATE: template.yaml
  STACK_NAME: ${{ vars.STACK_NAME || 'sam-app' }}

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM validate
        run: sam validate --lint --template "${{ env.SAM_TEMPLATE }}" --region "${{ env.AWS_REGION }}"

      - name: SAM build
        run: sam build --template "${{ env.SAM_TEMPLATE }}"

      - name: SAM deploy
        # --config-file applies samconfig.toml's parameter_overrides so the repo
        # is the source of truth (otherwise an existing stack reuses previously
        # deployed parameter values, e.g. a stale EnableWaf).
        run: |
          sam deploy \
            --stack-name "${{ env.STACK_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --config-file samconfig.toml \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --no-progressbar
